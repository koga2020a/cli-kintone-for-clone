name: Kintone CLI Build and Test

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build-and-test:
    runs-on: windows-latest  # Windowsビルド用
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'  # 必要なバージョンに調整してください

      - name: Build
        run: |
          # ビルドディレクトリの作成
          mkdir -p build/windows-x64
          
          # ビルド実行
          go build -o build/windows-x64/cli-kintone.exe
          
          # ビルド成功の確認（ファイルの存在チェック）
          if (Test-Path build/windows-x64/cli-kintone.exe) {
            echo "✅ Build successful"
          } else {
            echo "❌ Build failed"
            exit 1
          }

      - name: Prepare Test Environment
        run: |
          # テスト用のディレクトリ作成
          mkdir -p downloadRecord/13_新しいアプリ/attachmentFiles

      - name: Run Test
        env:
          KINTONE_DOMAIN: ${{ secrets.KINTONE_DOMAIN }}
          KINTONE_APP_ID: ${{ secrets.KINTONE_APP_ID }}
          KINTONE_API_TOKEN: ${{ secrets.KINTONE_API_TOKEN }}
        run: |
          # コマンド実行と出力の取得
          $output = & .\build\windows-x64\cli-kintone.exe --export `
            -d=$env:KINTONE_DOMAIN `
            -a=$env:KINTONE_APP_ID `
            -t=$env:KINTONE_API_TOKEN `
            -b="downloadRecord/13_新しいアプリ/attachmentFiles" `
            -e=utf-8 2>&1
          
          # 出力の表示
          echo "Command output:"
          echo $output
          
          # 期待する出力パターンのチェック
          $expectedLines = @(
            "処理を開始します...",
            "Successfully downloaded records for app $env:KINTONE_APP_ID"
          )
          
          $success = $true
          foreach ($line in $expectedLines) {
            if ($output -notmatch [regex]::Escape($line)) {
              echo "❌ Missing expected output: $line"
              $success = $false
            }
          }
          
          if ($success) {
            echo "✅ Test passed: All expected output patterns found"
          } else {
            echo "❌ Test failed: Some expected output patterns were missing"
            exit 1
          }

      - name: Cleanup
        if: always()  # テスト成否にかかわらず実行
        run: |
          # テスト用ディレクトリの削除
          Remove-Item -Recurse -Force downloadRecord -ErrorAction SilentlyContinue